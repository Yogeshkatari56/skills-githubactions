name: variables and screts

on:
  workflow_dispatch:

env:
  APP_NAME: "yogesh-application"

jobs:
  test-config:
    runs-on: ubuntu-latest

    tests:
      - name: Show env variable
        run: echo "Application = $APP_NAME"

      - name: Show repository variable
        run: echo "Environment = ${{ vars.APP_ENV }}"

      - name: Use secret safely
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          echo "Secret was supplied to the step"
          echo "Secret length = ${#API_KEY}"