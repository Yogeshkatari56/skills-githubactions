name: CI CD Pipeline Lab

on:
  workflow_dispatch:

jobs:
  dependency:
    runs-on: ubuntu-latest

    steps:
      - name: Generate version
        id: version_step
        run: echo "version=1.0.0" >> "$GITHUB_OUTPUT"
      
  printmessage:
    needs: dependency
    runs-on: ubuntu-latest
    steps:
      - name: print deployment version
        run: echo "deployment version is ${{version_step.GITHUB_OUTPUT}}"