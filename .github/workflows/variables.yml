name: variables and conditions Lab

on:
  #push:
  workflow_dispatch:

env:
  APP_NAME: "Yogesh-APP"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: show application
        run: echo "application is $APP_NAME"
      - name: Show event
        run: echo " event is ${{github.event_name}} and repository is ${{github.repository}}, branch is ${{github.ref}}"
      - name: condition execution
        if: ${{github.ref == 'refs/heads/main'}}
        run: echo "deploying $APP_NAME in to the production" 
      - name: Production Deployment
        if: ${{github.ref == 'refs/heads/main'}}
        run: echo "production deployment started"
      - name: Manual trigger check
        if: ${{github.event_name == 'workflow_dispatch'}}
        run: echo "pipeline is manually triggered"

