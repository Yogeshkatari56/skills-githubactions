name: list out the list of folder in the current repository

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  list_available_files_and_folders:
    runs-on: ubuntu-latest

    steps:
      - name: checkout to current branch
        uses: actions/checkout@v6
      - name: Say hello
        run: echo "hello yogesh"
      - name: show runner os
        run: uname -a
      - name: show files
        run: ls -la