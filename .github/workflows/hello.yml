name: list out the list of folder in the current repository

on:
  #push:
    #branches:
      #- main
      #- develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environmet:
        description: "environemt to deploy"
        requiered: true
        type: choice
        options:
          - dev
          - test
          - prod


jobs:
  list_available_files_and_folders:
    runs-on: ubuntu-latest

    steps:
      - name: checkout to current branch
        uses: actions/checkout@v6
      - name: Say hello
        run: echo "hello yogesh"
      - name: show environment info
        run: echo "Selected environment is ${{inputs.environmet}}"
      - name: show runner os
        run: uname -a
      - name: show repo info
        run: echo "repository is ${{github.repository}}"
      - name: show actor info
        run: echo "actor is ${{github.actor}}"
      - name: show event
        run: echo "event is ${{github.event_name}}"
      - name: show files
        run: ls -la
