name: practice Lab

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        version:
          - 20
          - 22
        include:
          - os: macos-latest
            version: 24
        exclude:
          - os: windows-latest
            version: 20
    runs-on: ${{matrix.os}}

    steps:
      - name: print version
        run: echo "testing version ${{matrix.version}} on ${{matrix.os}}"